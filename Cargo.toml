[package]
name = "resy"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.8.6"
aws-sdk-s3 = "1.106.0"
chrono = { version = "0.4.42", features = ["serde"] }
lz4_flex = "0.11.5"
rmp-serde = "1.3.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
zeroize = { version = "1.8.1", features = ["derive"] }
